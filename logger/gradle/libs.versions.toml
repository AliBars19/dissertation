#SO the reason why were doing this is because java standard libraru doesnt have functionality to com with JSON or SQLite and the design of our logger is to do both so we include it in here. think of it like package.json in mobile apps ykwim its gotta be in the bundle binary
[versions]
junit-jupiter = "6.0.1"
jackson = "2.22.4"
sqlite-jdbc = "3.54.1.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
